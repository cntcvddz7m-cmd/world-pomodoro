<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Pomodoro</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    text-align: center;
    margin: 0;
    padding: 32px 16px;
  }
  #enableSound {
    font-size: 18px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: black;
    color: white;
    margin-bottom: 18px;
  }
  #state {
    font-size: 56px;
    font-weight: 800;
    margin-top: 18px;
  }
  #next {
    font-size: 18px;
    margin-top: 14px;
    opacity: 0.8;
  }
  #time {
    font-size: 22px;
    margin-top: 18px;
    opacity: 0.8;
  }
  .badge {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid #ddd;
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 14px;
  }
</style>
</head>

<body>

<button id="enableSound">🔊 音を有効化</button>

<div class="badge">時計同期ポモドーロ（00/25/30/55）</div>
<div id="state">--</div>
<div id="next">--</div>
<div id="time">--</div>

<script>
  let soundEnabled = false;
  let lastState = "";

  // 外部ファイル不要のビープ音
  function beep() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = 880;      // 音の高さ
      gain.gain.value = 0.15;         // 音量（大きすぎ注意）

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      setTimeout(() => {
        osc.stop();
        ctx.close();
      }, 120); // 鳴らす長さms
    } catch (e) {
      // ここで落ちても表示は止めない
    }
  }

  function phaseFromMinute(min) {
    if (min < 25) return { name: "作業", nextAt: 25 };
    if (min < 30) return { name: "休憩", nextAt: 30 };
    if (min < 55) return { name: "作業", nextAt: 55 };
    return { name: "休憩", nextAt: 60 };
  }

  function pad(n){ return String(n).padStart(2, "0"); }

  function update() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const phase = phaseFromMinute(m);

    const nextMinute = phase.nextAt;
    const secondsToNext = ((nextMinute === 60 ? 60 : nextMinute) - m) * 60 - s;
    const mmLeft = Math.max(0, Math.floor(secondsToNext / 60));
    const ssLeft = Math.max(0, secondsToNext % 60);

    document.getElementById("state").textContent = phase.name;
    document.getElementById("next").textContent =
      `次：${pad(nextMinute % 60)}分（残り ${pad(mmLeft)}:${pad(ssLeft)}）`;
    document.getElementById("time").textContent =
      `${pad(h)}:${pad(m)}:${pad(s)}`;

    if (phase.name !== lastState) {
      if (soundEnabled) beep();
      lastState = phase.name;
    }
  }

  // ボタンが押されたら“音が鳴る権利”を得る（iOS対策）
  const btn = document.getElementById("enableSound");
  if (btn) {
    btn.addEventListener("click", () => {
      soundEnabled = true;
      beep(); // ここで鳴ればOK
      btn.style.display = "none";
    });
  }

  setInterval(update, 250);
  update();
</script>
</script>

</body>
</html>
