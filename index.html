<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Pomodoro</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    text-align: center;
    margin: 0;
    padding: 32px 16px;
  }
  #enableSound {
    font-size: 18px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: black;
    color: white;
    margin-bottom: 18px;
  }
  #state {
    font-size: 56px;
    font-weight: 800;
    margin-top: 18px;
  }
  #next {
    font-size: 18px;
    margin-top: 14px;
    opacity: 0.8;
  }
  #time {
    font-size: 22px;
    margin-top: 18px;
    opacity: 0.8;
  }
  .badge {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid #ddd;
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 14px;
  }
</style>
</head>

<body>

<button id="enableSound">🔊 音を有効化</button>

<div class="badge">時計同期ポモドーロ（00/25/30/55）</div>
<div id="state">--</div>
<div id="next">--</div>
<div id="time">--</div>

<script>
  let soundEnabled = false;
  let lastState = "";

  // 画面下にデバッグ行を作る
  function dbg(msg){
    let el = document.getElementById("dbg");
    if (!el) {
      el = document.createElement("div");
      el.id = "dbg";
      el.style.marginTop = "16px";
      el.style.fontSize = "13px";
      el.style.opacity = "0.7";
      document.body.appendChild(el);
    }
    el.textContent = msg;
  }

  // JSエラーを画面に出す
  window.addEventListener("error", (e) => {
    dbg("JSエラー: " + (e.message || "unknown"));
  });

  function buzz(pattern=[80]){ try{ if(navigator.vibrate) navigator.vibrate(pattern);}catch(e){} }

  function beep(freq=1200, ms=90, volume=0.25, type="square") {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, ms);
  }

  function workSound(){ beep(1500,70,0.30,"square"); setTimeout(()=>beep(1500,70,0.30,"square"),150); buzz([60,40,60]); }
  function breakSound(){ beep(650,160,0.28,"sine"); buzz([120]); }

  function phaseFromMinute(min) {
    if (min < 25) return { name: "作業", nextAt: 25 };
    if (min < 30) return { name: "休憩", nextAt: 30 };
    if (min < 55) return { name: "作業", nextAt: 55 };
    return { name: "休憩", nextAt: 60 };
  }
  function pad(n){ return String(n).padStart(2, "0"); }

  function update() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const phase = phaseFromMinute(m);

    // 背景色（絶対ここで変わるはず）
    document.body.style.background = (phase.name==="作業") ? "#eef6ff" : "#eaffea";

    // 残り
    const nextMinute = phase.nextAt;
    const secondsToNext = ((nextMinute===60?60:nextMinute)-m)*60 - s;
    const mmLeft = Math.max(0, Math.floor(secondsToNext/60));
    const ssLeft = Math.max(0, secondsToNext%60);

    document.getElementById("state").textContent = phase.name;
    document.getElementById("next").textContent =
      `次：${pad(nextMinute%60)}分（残り ${pad(mmLeft)}:${pad(ssLeft)}）`;
    document.getElementById("time").textContent =
      `${pad(h)}:${pad(m)}:${pad(s)}`;

    // デバッグ表示
    dbg(`soundEnabled=${soundEnabled} / lastState=${lastState} / now=${pad(h)}:${pad(m)}:${pad(s)}`);

    // 切替時に鳴らす
    if (phase.name !== lastState) {
      if (soundEnabled) {
        if (phase.name==="作業") workSound(); else breakSound();
      }
      lastState = phase.name;
    }
  }

  // ボタンを作る（もしHTML側に無くても出る）
  (function(){
    let btn = document.getElementById("enableSound");
    if (!btn) {
      btn = document.createElement("button");
      btn.id = "enableSound";
      btn.textContent = "🔊 音を有効化";
      btn.style.fontSize = "18px";
      btn.style.padding = "12px 20px";
      btn.style.borderRadius = "12px";
      btn.style.border = "none";
      btn.style.background = "black";
      btn.style.color = "white";
      btn.style.marginBottom = "18px";
      document.body.insertBefore(btn, document.body.firstChild);
    }
    btn.addEventListener("click", () => {
      soundEnabled = true;
      workSound(); // ここで鳴るなら許可OK
      btn.style.display = "none";
    });
  })();

  setInterval(update, 250);
  update();
</script>

</body>
</html>
